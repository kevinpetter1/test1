version: "3.9"

services:
  api:
    build: .
    container_name: predictive-dialer-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/predictive_dialer.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes: {}
